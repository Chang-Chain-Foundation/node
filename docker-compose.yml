services:
  geth:
    image: ethereum/client-go:v1.17.3
    restart: always
    network_mode: host
    user: root
    entrypoint: /root/init-script.sh
    command:
      - --datadir=/data
      - --networkid=5858
      - --syncmode=full
      - --cache.preimages          # จำเป็นถ้าจะ dump state เป็น genesis (10_finalize_genesis.py)
      # txpool ขยายใหญ่สำหรับ replay — default (~5k slots) ล้นแล้ว geth ทิ้ง tx เงียบๆ
      - --txpool.globalslots=200000
      - --txpool.globalqueue=100000
      - --txpool.accountslots=50000
      - --txpool.accountqueue=50000
      - --txpool.pricelimit=1
      - --txpool.lifetime=24h0m0s
      # archive = state ทุก block อยู่บนดิสก์ ไม่มีทาง "rewind แล้วตัด block ทิ้ง"
      # ตอนดับกะทันหัน  เปลืองที่มากขึ้นแต่แลกกับความปลอดภัยของเชน production
      - --gcmode=archive
      #      - --history.state=0
      #      - --history.transactions=0
      - --http
      - --http.addr=0.0.0.0
      - --http.api=debug,web3,eth,txpool,net
      - --http.vhosts="*"
      - --ws 
      - --ws.addr=0.0.0.0
      - --ws.api=debug,web3,eth,txpool,net,engine
      - --ws.origins="*"
      - --db.engine=pebble
      - --authrpc.port=8551
      - --authrpc.addr=0.0.0.0
      - --authrpc.vhosts=*
      - --authrpc.jwtsecret=/config/jwt.hex
      - --nat=extip:${NODE_PUBLIC_IP}
      - --nodekey=/config/nodekey
       - --bootnodes=${ELNODES}
    volumes:
        - ./data/geth:/data
        - ./config:/config
        - ./init-script.sh:/root/init-script.sh
    # ***** สำคัญที่สุด *****
    # default ของ docker คือรอแค่ 10 วิ แล้ว SIGKILL — geth flush state ไม่ทัน
    # (state ใหญ่เพราะ alloc 77MB) journal หาย -> boot ครั้งหน้า geth เจอ
    # head state หาย -> SetHead ถอยกลับ แล้ว "ตัด block ที่สูงกว่าทิ้ง"
    # นี่คือสาเหตุที่เชนย้อนจาก 35,968 มาเหลือ 1,023
    stop_grace_period: 10m
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  beacon:
    image: sigp/lighthouse:v8.1.3
    restart: always
    network_mode: host
    security_opt:
      - seccomp:unconfined
    volumes:
      - ./data/lighthouse:/root/.lighthouse
      - ./config:/config
    command: >
      lighthouse beacon_node
      --testnet-dir /config
      --datadir /root/.lighthouse
      --http
      --http-address 0.0.0.0
      --http-port 5052
      --execution-endpoint http://${NODE_PUBLIC_IP}:8551
      --execution-jwt /config/jwt.hex
      --enr-udp-port 9000
      --enr-tcp-port 9000
      --port 9000
      --http-allow-origin=*
      --listen-address=0.0.0.0
      --discovery-port 9000
      --suggested-fee-recipient=${FEE_RECIPIENT}
      --disable-enr-auto-update 
      --enr-address=${NODE_PUBLIC_IP}
      --staking
      --prune-payloads false
      --boot-nodes=${CLNODES}
      --checkpoint-sync-url=https://cl.cthscan.com
    # --supernode ถอดออก: กิน RAM/ดิสก์หนักมากโดยไม่มีประโยชน์กับ node เดียว
    # ที่ไม่มี peer และเพิ่มโอกาส OOM -> ดับกะทันหัน -> DB เสีย
    # --prune-payloads false: เก็บ execution payload ไว้ ถ้า EL หายจะยัง
    # มีทางสร้างกลับได้ (ตอน DB เดิมพัง lighthouse บอก "payloads are pruned"
    # ทำให้กู้ไม่ได้เลย)
    stop_grace_period: 3m
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
      
  validator:
    image: sigp/lighthouse:v8.1.3
    security_opt:
      - seccomp:unconfined
    network_mode: host
    command:
      - lighthouse
      - vc
      - --debug-level=info
      - --testnet-dir=/config
      - --validators-dir=/validator-keys/keys
      - --secrets-dir=/validator-keys/secrets
      - --init-slashing-protection
      - --beacon-nodes=http://${NODE_PUBLIC_IP}:5052
      - --suggested-fee-recipient=${FEE_RECIPIENT}
    volumes:
      - ./config:/config
      - ./vc/data:/validator-keys
    depends_on:
      - beacon
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
